[workspace]
resolver = "2"
members = [
    "crates/spirit-core",
    "crates/spirit-cli",
    "apps/spirit-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://example.invalid/stackspirit"

[workspace.dependencies]
async-trait = "0.1"
clap = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
ulid = "3"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
