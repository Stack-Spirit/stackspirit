name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: desktop / web / ui (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: bash scripts/verify-engine-checksum.sh --self-test

  rust-core:
    name: spirit-core workspace (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Tauri host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: true
      - run: scripts/cargo-gate.sh fmt --all -- --check
      - run: scripts/cargo-gate.sh clippy --workspace --all-targets -- -D warnings
      - run: scripts/cargo-gate.sh test -p spirit-core --features fixtures
      - run: scripts/cargo-gate.sh test -p spirit-cli

  runtime:
    name: runtime rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: true
          cache-workspaces: runtime
          rustflags: ""
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  runtime-packaging:
    name: runtime npm / PyPI packaging tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/packaging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: npm launcher tests
        run: |
          # npm-stackspirit is skipped: its package.test.js requires the stale path ../../npm/package.json.
          (cd npm/stackspirit && npm test)
          (cd npm/legacy-vowp && npm test)
          node --test npm/test/*.test.js
      - name: PyPI launcher tests
        run: |
          python -m pip install pytest
          (cd pypi-stackspirit && PYTHONPATH=src python -m pytest tests)
