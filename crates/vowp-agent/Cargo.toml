[package]
name = "vowp-agent"
description = "Mac-side v0.4 local agent: config, node key, transport and frame client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vowp-agent"
keywords = ["vowp", "agent", "ssh", "ed25519", "orchestrator"]
categories = ["development-tools", "command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = "0.3.45"
vowp-protocol = { version = "0.3.0", path = "../vowp-protocol" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
