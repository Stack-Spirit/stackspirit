[package]
name = "vowp-cli"
description = "The `vowp` command-line binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vowp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.45"
toml = "1.2.1"
vowp-adapters = { version = "0.1.0-dev", path = "../vowp-adapters" }
vowp-core = { path = "../vowp-core" }
vowp-graph = { version = "0.1.0-dev", path = "../vowp-graph" }
vowp-protocol = { path = "../vowp-protocol" }
vowp-store = { version = "0.1.0-dev", path = "../vowp-store" }
vowp-tmux = { version = "0.1.0-dev", path = "../vowp-tmux" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
