[package]
name = "spirit-cli"
description = "Thin `spirit` command line over the headless spirit-core crate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "spirit"
path = "src/main.rs"

[lib]
name = "spirit_cli"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
spirit-core = { path = "../spirit-core" }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["fixtures"]
# Compile the `--fixtures` preview path. Enabled by default for this developer CLI;
# a release build may pass `--no-default-features` to remove fixture documents.
fixtures = ["spirit-core/fixtures"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
