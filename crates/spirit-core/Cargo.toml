[package]
name = "spirit-core"
description = "Headless Rust core for StackSpirit: VOWP wire model, SSH transport, host store, views, engine and gates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
tempfile.workspace = true
zeroize.workspace = true
keyring = { workspace = true, optional = true }
ssh-key = { version = "0.6.7", default-features = false, features = [
    "ed25519",
    "encryption",
    "getrandom",
] }

[features]
default = []
# Compile-time golden fixture loading for preview and integration tests.
# Never enabled in a release build.
fixtures = []
# The real OS keychain. D2/D4 enable this; unit tests use FakeKeychain.
keychain = ["dep:keyring"]
# Reserved for D4 engine packaging; the D1 skeleton compiles without it.
engine = []
# Convenience bundle used by the desktop host.
desktop = ["engine", "keychain"]
# Optional manual live smoke. Never used by CI.
live-smoke = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
